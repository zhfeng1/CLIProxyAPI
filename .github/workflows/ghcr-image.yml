name: ghcr-image

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional extra image tag
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/cli-proxy-api"
          short_sha="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "image=${image}"
            echo "commit=${short_sha}"
            echo "build_date=${build_date}"
            echo "version=${GITHUB_REF_NAME}"
            echo "tags<<EOF"
            echo "${image}:sha-${short_sha}"

            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${image}:${GITHUB_REF_NAME}"
            fi

            if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
              safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
              if [ -n "${safe_ref}" ]; then
                echo "${image}:branch-${safe_ref}"
              fi
              if [ "${GITHUB_REF_NAME}" = "main" ]; then
                echo "${image}:latest"
              fi
            fi

            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              extra_tag="${{ inputs.tag }}"
              if [ -n "${extra_tag}" ]; then
                safe_tag="$(printf '%s' "${extra_tag}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
                if [ -n "${safe_tag}" ]; then
                  echo "${image}:${safe_tag}"
                fi
              fi
            fi

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
